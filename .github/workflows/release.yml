# A tag v<version> (the version of barcode_decoder/config.yaml) builds the image for linux/amd64 and linux/arm64
# and pushes ghcr.io/7hemas7er/barcode-decoder:<version> and :latest. The tests run first, on the amd64 image.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: the tag matches config.yaml
        run: |
          v=$(sed -n 's/^version: "\(.*\)"$/\1/p' barcode_decoder/config.yaml)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, config.yaml $v"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/7hemas7er/barcode-decoder
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: barcode_decoder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
